# Cloudflare Pages 配置(方案 A)。部署与 GitHub 集成自动部署都读取本文件,
# [[kv_namespaces]] 的 id 必须是真实 namespace ID(占位符会导致部署失败)。
# 该 ID 不是机密:仅凭它无法读写 KV(真正凭据是 Cloudflare 登录态/API 密钥);
# 密码与 JWT 密钥等真机密存在 Settings → Secrets 里,从不写入本文件或仓库。
name = "travel-pin"
pages_build_output_dir = "."
compatibility_date = "2024-11-11"

[[kv_namespaces]]
binding = "PIN_KV"
id = "b35b027f7052494f8fc047bc82c1f602"

# 环境变量(敏感内容用 Secrets 配置,勿写进本文件):
#   EDIT_PASSWORD  编辑密码(进编辑模式时输入)
#   JWT_SECRET     JWT 签名密钥,建议 `openssl rand -base64 48`