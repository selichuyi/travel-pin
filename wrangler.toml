# Cloudflare Pages 配置(方案 A)。KV 绑定在 Dashboard 配置(见 DEPLOY.md 第 4 步):
#   Pages 项目 → Settings → Functions → KV namespace bindings → 变量名 PIN_KV → 对应的 namespace
# 绑定只保留 dashboard 一种来源,避免与配置文件重复冲突;namespace ID 也就不用写进仓库。
# 环境变量(敏感内容用 Secrets 配置,勿写进本文件):
#   EDIT_PASSWORD  编辑密码(进编辑模式时输入)
#   JWT_SECRET     JWT 签名密钥,建议 `openssl rand -base64 48`
name = "travel-pin"
pages_build_output_dir = "."
compatibility_date = "2024-11-11"

# 环境变量(敏感内容用 Secrets 配置,勿写进本文件):
#   EDIT_PASSWORD  编辑密码(进编辑模式时输入)
#   JWT_SECRET     JWT 签名密钥,建议 `openssl rand -base64 48`